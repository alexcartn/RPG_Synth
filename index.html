<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bourdon : machine à ambiances modales</title>
<meta name="description" content="Bourdon : machine à ambiances modales pour dungeon synth et tavernes. Audio synthétisé dans le navigateur, export WAV, boucle, stems et MIDI.">
<meta name="theme-color" content="#efe6d0">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bourdon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="folio">
  <header class="head">
    <p class="kicker">machina modalis</p>
    <h1>Bourdon</h1>
    <p class="installrow"><button class="lnk" id="install" type="button" hidden>Installer l'application</button></p>
    <p class="lede" lang="fr">Un bourdon, des voix, des gammes que l'on choisit ou que l'on dessine. Une graine donne une pièce, la même graine redonne la même pièce.</p>
  </header>

  <nav class="toc" id="toc" aria-label="Chapitres"></nav>

  <div class="cols">
    <main class="text" id="chapters"></main>

    <aside class="marge" aria-label="Lecture et gamme">
      <div class="lecture">
        <button class="seal" id="play" aria-pressed="false">Incipe</button>
        <div class="seedbox ctl">
          <label for="seed">Semen</label>
          <div class="seedrow">
            <input type="number" id="seed" min="1" max="999999" inputmode="numeric">
            <button class="lnk" id="dice" type="button">Sors</button>
          </div>
        </div>
      </div>
      <div class="tempo"><b id="tempoNum">120</b><span id="tempoCap">noires par minute</span></div>
      <div class="tension" id="tensionHost"></div>
      <div class="ringwrap">
        <svg id="ring" viewBox="0 0 200 200" role="group" aria-label="Cercle des douze hauteurs"></svg>
        <p class="ringcap" id="ringcap"></p>
        <p class="ringhint">Touche une note du cercle pour bâtir ta propre gamme.</p>
      </div>
      <div class="scopewrap" hidden>
        <canvas id="scope" width="680" height="112" aria-label="Forme d'onde"></canvas>
        <canvas id="pend" width="680" height="112" aria-label="Pendules" hidden></canvas>
      </div>
      <div class="presets">
        <span class="ctl"><label>Exempla</label></span>
        <div class="row" id="presets"></div>
      </div>
      <div class="presets scenes">
        <span class="ctl"><label>Scaenae</label></span>
        <div class="row" id="scenes"></div>
        <div class="row">
          <button class="lnk" id="saveScene" type="button">Mémoriser la scène actuelle</button>
          <button class="lnk" id="clearScenes" type="button">Tout effacer</button>
        </div>
        <div class="ctl fadebox"><label for="fade">Transitus</label>
          <select id="fade"><option value="0.5">Sec (0,5 s)</option><option value="4">Court (4 s)</option><option value="10" selected>Moyen (10 s)</option><option value="25">Long (25 s)</option></select>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="dock"><button class="seal" id="play2" aria-pressed="false">Incipe</button><div class="dockT ctl"><div class="l"><label for="tension2">Tensio</label><output id="tension2o"></output></div><input type="range" id="tension2" min="0" max="1" step="0.01" value="0.5"></div></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>

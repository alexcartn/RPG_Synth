<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bourdon : machine à ambiances modales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<meta name="description" content="Bourdon : machine à ambiances modales pour dungeon synth et tavernes. Audio synthétisé dans le navigateur, export WAV, boucle, stems et MIDI.">
<meta name="theme-color" content="#efe6d0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23a3301c'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23d9a93a' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="folio">
  <header class="head">
    <p class="kicker">machine à ambiances modales</p>
    <h1>Bourdon</h1>
    <p class="lede">Un bourdon, des voix, des gammes que l'on choisit ou que l'on dessine. Une graine donne une pièce, la même graine redonne la même pièce.</p>
  </header>

  <div class="cols">
    <main class="text" id="chapters"></main>

    <aside class="marge" aria-label="Lecture et gamme">
      <div class="lecture">
        <button class="seal" id="play" aria-pressed="false">Jouer</button>
        <div class="seedbox ctl">
          <label for="seed">Graine</label>
          <div class="seedrow">
            <input type="number" id="seed" min="1" max="999999" inputmode="numeric">
            <button class="lnk" id="dice" type="button">Tirer au sort</button>
          </div>
        </div>
      </div>
      <div class="tempo"><b id="tempoNum">120</b><span id="tempoCap">noires par minute</span></div>
      <div class="tension" id="tensionHost"></div>
      <div class="ringwrap">
        <svg id="ring" viewBox="0 0 200 200" role="group" aria-label="Cercle des douze hauteurs"></svg>
        <p class="ringcap" id="ringcap"></p>
        <p class="ringhint">Touche une note du cercle pour bâtir ta propre gamme.</p>
      </div>
      <div class="scopewrap">
        <canvas id="scope" width="680" height="112" aria-label="Forme d'onde"></canvas>
        <canvas id="pend" width="680" height="112" aria-label="Pendules" hidden></canvas>
      </div>
      <div class="presets">
        <span class="ctl"><label>Préréglages</label></span>
        <div class="row" id="presets"></div>
      </div>
      <div class="presets scenes">
        <span class="ctl"><label for="fade">Mes scènes</label></span>
        <div class="row" id="scenes"></div>
        <div class="row">
          <button class="lnk" id="saveScene" type="button">Mémoriser la scène actuelle</button>
          <button class="lnk" id="clearScenes" type="button">Tout effacer</button>
        </div>
        <div class="ctl fadebox"><label for="fade">Fondu enchaîné</label>
          <select id="fade"><option value="0.5">Sec (0,5 s)</option><option value="4">Court (4 s)</option><option value="10" selected>Moyen (10 s)</option><option value="25">Long (25 s)</option></select>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="dock"><button class="seal" id="play2" aria-pressed="false">Jouer</button></div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
</body>
</html>

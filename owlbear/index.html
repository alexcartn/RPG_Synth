<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bourdon pour Owlbear Rodeo</title>
<style>
  :root{--fond:#1e1e24; --texte:#ececf1; --doux:#a8a8b3; --trait:#4a4a55; --accent:#d2694f; color-scheme:dark}
  :root[data-theme="light"]{--fond:#ffffff; --texte:#1f1f24; --doux:#5d5d66; --trait:#c9c9d1; --accent:#a3301c; color-scheme:light}
  body{margin:0; padding:12px 14px 16px; background:var(--fond); color:var(--texte); font:14px/1.4 system-ui, sans-serif}
  h1{font-size:16px; margin:0 0 8px; letter-spacing:.04em}
  h2{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--doux); margin:14px 0 6px; font-weight:600}
  p{margin:4px 0; color:var(--doux); font-size:12.5px}
  .rang{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  button{font:inherit; color:var(--texte); background:transparent; border:1px solid var(--trait); border-radius:6px; padding:6px 10px; cursor:pointer}
  button:hover{border-color:var(--texte)}
  button.plein,button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  label{display:block; font-size:12px; color:var(--doux); margin:6px 0 2px}
  input[type=text],input[type=number]{width:100%; box-sizing:border-box; font:inherit; color:var(--texte); background:transparent; border:1px solid var(--trait); border-radius:6px; padding:5px 8px}
  input[type=range]{width:100%}
  #etat{min-height:1.4em}
  .joueur{display:none}
  body.est-joueur .meneur{display:none} body.est-joueur .joueur{display:block}
</style>
</head>
<body>
<h1>Bourdon</h1>
<p class="joueur">Seul le meneur pilote Bourdon : la musique sonne sur son ordinateur.</p>
<div class="meneur">
  <div class="rang"><button id="lier" class="plein" type="button">Ouvrir ou relier Bourdon</button><button id="jouer" type="button">Jouer</button><button id="arreter" type="button">Arrêter</button></div>
  <p id="etat" aria-live="polite">Bourdon s'ouvre dans sa propre fenêtre. Clique une fois dedans pour autoriser le son.</p>

  <h2>Cette scène</h2>
  <label for="amb">Ambiance</label><input id="amb" type="text" list="ambs" placeholder="Crypta, Vigilia, Taberna…"><datalist id="ambs"></datalist>
  <label for="emo">Ou des émotions</label><input id="emo" type="text" placeholder="mystérieux, sacré">
  <label for="uni">Univers (avec les émotions)</label><input id="uni" type="text" placeholder="dungeon, dark, medieval…">
  <label for="ten">Tension de la scène</label><input id="ten" type="number" min="0" max="1" step="0.05" placeholder="vide : ne pas toucher">
  <div class="rang" style="margin-top:8px"><button id="garder" type="button">Garder pour cette scène</button><button id="appliquer" type="button">Jouer l'ambiance de la scène</button></div>
  <label><input id="suivre" type="checkbox" checked> Jouer l'ambiance de la scène dès qu'elle change</label>

  <h2>En direct</h2>
  <label for="tension">Tension</label><input id="tension" type="range" min="0" max="1" step="0.05" value="0.5">
  <div class="rang" style="margin-top:6px">
    <button data-g="suspense" type="button">Suspense</button><button data-g="revelation" type="button">Révélation</button>
    <button data-g="apaisement" type="button">Apaisement</button><button data-g="surprise" type="button">Surprise</button>
  </div>
  <div class="rang" style="margin-top:6px"><button id="voix" type="button" aria-pressed="false">Sous la voix</button></div>
</div>
<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm";
/* Bourdon est publié sur le même site que cette extension : il accepte ses ordres (même origine) */
const BOURDON=new URL("../",location.href).href, CLE="fr.bourdon/scene", $=id=>document.getElementById(id);
let fen=null, pret=false, file=[], dernier="";
try{ dernier=localStorage.getItem("bourdon.obr.dernier")||""; }catch(e){}
const etat=t=>{ $("etat").textContent=t; };
/* retrouve la fenêtre de Bourdon sans la recharger ; l'ouvre si elle n'existe pas (il faut un clic pour cela) */
function trouver(ouvrir){
  if(fen&&!fen.closed) return fen;
  if(!ouvrir) return null; /* sans clic, aucune fenêtre ne s'ouvre, même vide */
  let w=null;
  try{ w=window.open("","bourdon"); }catch(e){}
  if(!w){ if(ouvrir) etat("Le navigateur a bloqué la fenêtre : autorise les fenêtres pour Owlbear Rodeo."); return null; }
  let estBourdon=false; try{ estBourdon=!!w.teleRun; }catch(e){}
  if(!estBourdon){ w.location.href=BOURDON+"?telecommande=1"; pret=false; }
  else pret=true;
  fen=w; attendre(); return w;
}
/* Bourdon est prêt quand sa télécommande existe : on vide alors la file d'ordres */
function attendre(){ const t=setInterval(()=>{ if(!fen||fen.closed){ clearInterval(t); return; } let ok=false; try{ ok=!!fen.teleRun&&fen.document.readyState==="complete"; }catch(e){} if(ok){ clearInterval(t); pret=true; vider(); etat("Bourdon est relié."); } },250); }
function vider(){ const q=file.splice(0); q.forEach(m=>fen.postMessage(m,location.origin)); }
function envoyer(m,ouvrir){ m={bourdon:1,...m}; const w=trouver(ouvrir!==false); if(!w){ file.push(m); return; } if(!pret){ file.push(m); return; } w.postMessage(m,location.origin); }
window.addEventListener("message",e=>{ const m=e.data; if(!m||m.bourdon!==1||e.origin!==location.origin) return;
  if(m.ok===false&&m.erreur) etat("Bourdon : "+m.erreur);
  if(m.etat){ const dl=$("ambs"); if(dl&&!dl.options.length) (m.etat.ambiances||[]).forEach(n=>dl.appendChild(new Option(n))); $("voix").setAttribute("aria-pressed",m.etat.sousLaVoix?"true":"false"); $("jouer").setAttribute("aria-pressed",m.etat.joue?"true":"false"); } });

/* l'ambiance d'une scène : nommée, ou des émotions dans un univers, et sa tension */
function jouerScene(sc,ouvrir){
  if(!sc) return false;
  if(sc.ambiance) envoyer({cmd:"ambiance",nom:sc.ambiance,jouer:true},ouvrir);
  else if(sc.emotions){ envoyer({cmd:"emotions",liste:sc.emotions,univers:sc.univers||undefined},ouvrir); envoyer({cmd:"jouer"},ouvrir); }
  else return false;
  if(sc.tension!==undefined&&sc.tension!==""&&sc.tension!==null) envoyer({cmd:"tension",valeur:Number(sc.tension)},ouvrir);
  dernier=JSON.stringify(sc); try{ localStorage.setItem("bourdon.obr.dernier",dernier); }catch(e){}
  return true;
}
function remplir(sc){ sc=sc||{}; $("amb").value=sc.ambiance||""; $("emo").value=sc.emotions||""; $("uni").value=sc.univers||""; $("ten").value=sc.tension===undefined?"":sc.tension; }
async function lireScene(){ try{ if(!(await OBR.scene.isReady())) return null; const md=await OBR.scene.getMetadata(); return md[CLE]||null; }catch(e){ return null; } }
/* une scène qui change, ou ses réglages : si elle a une ambiance nouvelle, on la joue (sans ouvrir de fenêtre : il faut un clic pour cela) */
async function suivre(){ const sc=await lireScene(); remplir(sc); if(!$("suivre").checked||!sc) return; const k=JSON.stringify(sc); if(k===dernier) return; if(!jouerScene(sc,false)) return; if(!fen) etat("Nouvelle scène : clique « Ouvrir ou relier Bourdon » pour l'entendre."); }

OBR.onReady(async()=>{
  try{ const th=await OBR.theme.getTheme(); if(th&&th.mode==="LIGHT") document.documentElement.dataset.theme="light"; }catch(e){}
  const role=await OBR.player.getRole(); if(role!=="GM"){ document.body.classList.add("est-joueur"); return; }
  $("lier").onclick=()=>{ fen=null; trouver(true); envoyer({cmd:"etat"}); };
  $("jouer").onclick=()=>envoyer({cmd:"jouer"}); $("arreter").onclick=()=>envoyer({cmd:"arreter"});
  $("garder").onclick=async()=>{ const sc={ambiance:$("amb").value.trim(),emotions:$("emo").value.trim(),univers:$("uni").value.trim(),tension:$("ten").value===""?"":Number($("ten").value)};
    try{ await OBR.scene.setMetadata({[CLE]:sc}); etat("Gardé pour cette scène."); OBR.notification.show("Bourdon : ambiance gardée pour cette scène.","SUCCESS"); }catch(e){ etat("Ouvre d'abord une scène."); } };
  $("appliquer").onclick=async()=>{ const sc=await lireScene(); if(!jouerScene(sc,true)) etat("Cette scène n'a pas encore d'ambiance : remplis les champs puis « Garder »."); };
  $("tension").onchange=()=>envoyer({cmd:"tension",valeur:Number($("tension").value)});
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>envoyer({cmd:"geste",nom:b.dataset.g,ampleur:1}));
  $("voix").onclick=()=>envoyer({cmd:"sousLaVoix"});
  OBR.scene.onReadyChange(r=>{ if(r) suivre(); else remplir(null); });
  OBR.scene.onMetadataChange(()=>suivre());
  suivre();
});
</script>
</body>
</html>
